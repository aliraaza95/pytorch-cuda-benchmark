[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-cuda-benchmark"
version = "0.1.0"
description = "A reproducible PyTorch benchmark comparing CPU and CUDA-enabled GPU training performance across batch sizes using CIFAR-10 and ResNet-18."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ali Raza" }
]
dependencies = [
    "matplotlib>=3.9,<4.0",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<4.0",
    "psutil>=6.0,<8.0",
    "pyyaml>=6.0,<7.0",
    "torch>=2.13,<3.0",
    "torchvision>=0.28,<1.0"
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.29,<8.0",
    "jupyterlab>=4.4,<5.0"
]
dev = [
    "pytest>=8.3,<10.0",
    "ruff>=0.9,<1.0"
]